# systemd drop-in: /etc/systemd/system/vulnagent.service.d/defectdojo.conf
# After every successful vulnagent run (exit 0 or 1), upload the report to DefectDojo.
# The leading "-" keeps an unreachable DefectDojo from marking the run as failed.
[Service]
ExecStartPost=-/usr/local/sbin/vulnagent-dojo -c /etc/vulnagent/defectdojo.json
